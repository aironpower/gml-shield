# Analyse SonarCloud exécutée par la CI (cf. guide qualité de code, chapitre « Analyse statique »).
sonar.organization=aironpower
sonar.projectKey=aironpower_gml-shield
sonar.projectName=GML-SHIELD

sonar.sources=src,public,.github
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Couverture produite par Vitest (npm run test:couverture).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Mêmes exclusions que vitest.config.ts ; le client web est vérifié par la recette, pas par Vitest.
sonar.coverage.exclusions=src/serveur.ts,src/migrer.ts,src/creer-comptes-demo.ts,src/preparer-stockage.ts,public/**

# La CI échoue si la Quality Gate échoue : aucune fusion possible sans elle.
sonar.qualitygate.wait=true
