# Base PostgreSQL de développement et de test, réservée au poste local.
# Pourquoi « trust » sans mot de passe : aucun secret n'est versionné et le port n'est
# publié que sur 127.0.0.1, donc inaccessible depuis le réseau. Ne jamais réutiliser
# cette configuration hors d'un poste de développement.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gml_shield
      POSTGRES_DB: gml_shield
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
      - ./outils/postgres/creer-base-test.sql:/docker-entrypoint-initdb.d/creer-base-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gml_shield']
      interval: 5s
      retries: 10

volumes:
  donnees-postgres:
