# Barrière qualité obligatoire avant toute fusion dans main (cf. guide qualité de code).
name: Intégration continue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    name: Format, lint, typage, tests, build
    runs-on: ubuntu-latest
    # Même configuration que le docker-compose local : base de test jetable, sans mot de passe.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gml_shield
          POSTGRES_DB: gml_shield_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gml_shield"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : Sonar en a besoin pour distinguer le nouveau code de l'existant.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances (versions verrouillées)
        run: npm ci --ignore-scripts

      - name: Vérifier les vulnérabilités connues des dépendances
        run: npm audit --audit-level=high --omit=dev

      - name: Vérifier le formatage
        run: npm run format:verifier

      - name: Analyse statique
        run: npm run lint

      - name: Vérifier le typage
        run: npm run typage

      - name: Tests et seuils de couverture
        run: npm run test:couverture

      - name: Analyse SonarCloud et Quality Gate
        # Action épinglée par empreinte de commit (v8.2.2) : une étiquette peut être déplacée.
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Compiler
        run: npm run build
